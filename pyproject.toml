[project]
name = "telco-customer-churn-mlops"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "dvc[s3]>=3.50,<4.0",
  "mlflow>=2.17,<4.0",
  "dagshub>=0.5,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
